  async function send(){
    if(busy){
      await stopActiveBackendJob();
      if(abortController) abortController.abort();
      return;
    }
    var text = textarea.value.trim();
    if(!text && !selectedImages.length) return;
    var content = addImageParts(text || "Elemezd a csatolt képet.");
    messages.push({role:"user", content:content});
    persistCurrent();
    textarea.value = "";
    textarea.style.height = "auto";
    selectedImages = [];
    updateImgStrip();
    var streamingMessage = {role:"assistant", content:"", thinking:"", isStreaming:true, thinkingOpen:false, thinkingManual:false, timeline:[]};
    messages.push(streamingMessage);
    scheduleStreamRender(streamingMessage);
    setBusy(true);
    startThinkingClock(streamingMessage);
    abortController = new AbortController();
    var requestConversationId = currentId;
    var requestBranchId = activeBranchId;
    var requestToken = abortController;
    var reader = null;
    try{
      var modelMessages = messages.filter(function(message){
        return message !== streamingMessage && !message.isError;
      }).map(function(message){
        return {role: message.role, content: message.content};
      });
      var response = await fetch("/api/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:modelMessages, max_tokens:4096, temperature:0.7, top_p:0.9, stream:true}),
        signal: abortController.signal,
        credentials:"same-origin"
      });
      if(!response.ok){
        var errorResult = await response.json().catch(function(){ return {}; });
        throw new Error(errorResult.error && errorResult.error.message ? errorResult.error.message : "A modell nem válaszolt.");
      }
      var responseType = response.headers.get("content-type") || "";
      if(responseType.indexOf("text/event-stream") === -1){
        var result = await response.json();
        var assistantMessage = result.choices && result.choices[0] && result.choices[0].message;
        if(!assistantMessage || (typeof assistantMessage.content !== "string" && typeof assistantMessage.reasoning_content !== "string")) throw new Error("A modell válasza érvénytelen.");
        var parsedMessage = splitAssistantMessage(assistantMessage);
        streamingMessage.content = parsedMessage.content;
        streamingMessage.thinking = parsedMessage.thinking;
        streamingMessage.thinkingEndedAt = Date.now();
        addTimeline(streamingMessage, "done", "Válasz elkészült");
      }else{
        if(!response.body) throw new Error("A böngésző nem támogatja a válasz streamelését.");
        reader = response.body.getReader();
        var decoder = new TextDecoder();
        var streamBuffer = "";
        var streamDone = false;
        var receivedAny = false;
        function processEventData(data){
          if(!data) return;
          if(data === "[DONE]"){ streamDone = true; return; }
          var event;
          try{ event = JSON.parse(data); }catch(e){ return; }
          if(event.type === "meta" && event.job_id){
            if(requestToken === abortController) activeChatJobId = event.job_id;
            return;
          }
          if(event.type === "route"){
            var routeText = event.intent ? "Terv: " + event.intent : "A stratégiai modell elkészítette a tervet";
            addTimeline(streamingMessage, "thought", routeText);
            scheduleStreamRender(streamingMessage);
            return;
          }
          if(event.type === "agent_event"){
            var agentEvent = event.event || {};
            var eventType = agentEvent.type || "agent_event";
            var label = "Agent esemény";
            var timelineType = "thought";
            if(eventType === "tool_start"){
              label = "Eszköz: " + (agentEvent.tool || "művelet");
              timelineType = "tool";
            }else if(eventType === "tool_result"){
              label = (agentEvent.ok === false ? "Eszközhiba" : "Eszköz kész") + (agentEvent.tool ? ": " + agentEvent.tool : "");
              timelineType = agentEvent.ok === false ? "thought" : "done";
            }else if(eventType === "model_start"){
              label = "Modell: " + (agentEvent.model || "specialista");
            }else if(eventType === "model_output"){
              label = "Modellválasz feldolgozva";
            }else if(eventType.indexOf("subagent_") === 0){
              label = "Subagent: " + eventType.slice(9).replace(/_/g," ");
              timelineType = eventType.indexOf("tool") !== -1 ? "tool" : (eventType === "subagent_done" ? "done" : "thought");
            }else if(eventType === "plan_replaced" || eventType === "plan_mutated"){
              label = "A terv frissült";
            }else if(eventType === "verification_failed"){
              label = "Ellenőrzés sikertelen, folytatás szükséges";
            }else if(eventType === "progress"){
              label = "Lépés elkészült: " + (agentEvent.step_id || "");
              timelineType = "done";
            }else if(eventType === "artifact" && agentEvent.artifact){
              var artifact = agentEvent.artifact;
              label = "Fájl elkészült: " + (artifact.name || artifact.artifact_id || "artifact");
              timelineType = "done";
              if(artifact.artifact_id){
                var artifactName = String(artifact.name || "Letöltés").replace(/[\[\]]/g, "");
                streamingMessage.content += "\n\n[" + artifactName + "](/api/artifacts/" + encodeURIComponent(artifact.artifact_id) + ")";
              }
            }
            addTimeline(streamingMessage, timelineType, label);
            scheduleStreamRender(streamingMessage);
            return;
          }
          if(event.choices && event.choices[0] && event.choices[0].delta){
            var delta = event.choices[0].delta;
            event = {
              type: "delta",
              content: typeof delta.content === "string" ? delta.content : undefined,
              reasoning_content: typeof delta.reasoning_content === "string" ? delta.reasoning_content : (typeof delta.reasoning === "string" ? delta.reasoning : undefined)
            };
            if(event.choices && event.choices[0].finish_reason) event.type = "done";
          }
          if(event.type === "delta" || (!event.type && (event.content || event.reasoning_content))){
            receivedAny = true;
            if(typeof event.reasoning_content === "string" && event.reasoning_content){
              streamingMessage.thinking += event.reasoning_content;
              if(!streamingMessage.thinkingManual) streamingMessage.thinkingOpen = true;
              addTimeline(streamingMessage, "thought", event.reasoning_content);
            }
            if(typeof event.content === "string" && event.content){
              streamingMessage.content += event.content;
              var visible = event.content.replace(/<think>[\s\S]*?<\/think>/g, "").replace(/<think>[\s\S]*$/g, "").trim();
              if(visible){
                if(!streamingMessage.thinkingEndedAt) streamingMessage.thinkingEndedAt = Date.now();
                if(!streamingMessage.thinkingManual) streamingMessage.thinkingOpen = false;
              } else {
                if(!streamingMessage.thinkingManual) streamingMessage.thinkingOpen = true;
              }
            }
            if(event.tool_call || event.tool){
              addTimeline(streamingMessage, "tool", "Eszközhívás folyamatban");
            }
            scheduleStreamRender(streamingMessage);
          }else if(event.type === "error"){
            throw new Error(event.message || "A modell streamelése megszakadt.");
          }else if(event.type === "done"){
            streamingMessage.thinkingEndedAt = streamingMessage.thinkingEndedAt || Date.now();
            addTimeline(streamingMessage, "done", "Befejezés ✓");
            streamDone = true;
          }
        }
        while(!streamDone){
          var readResult = await reader.read();
          if(readResult.done) break;
          streamBuffer += decoder.decode(readResult.value, {stream:true});
          streamBuffer = streamBuffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
          var events = streamBuffer.split(/\n\n/);
          streamBuffer = events.pop() || "";
          events.forEach(function(rawEvent){
            var data = rawEvent.split(/\n/).filter(function(line){ return line.indexOf("data:") === 0; }).map(function(line){ return line.slice(5).trim(); }).join("\n");
            processEventData(data);
          });
        }
        streamBuffer += decoder.decode();
        streamBuffer = streamBuffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        if(streamBuffer.trim()){
          var finalEvents = streamBuffer.split(/\n\n/);
          finalEvents.forEach(function(rawEvent){
            var data = rawEvent.split(/\n/).filter(function(line){ return line.indexOf("data:") === 0; }).map(function(line){ return line.slice(5).trim(); }).join("\n");
            processEventData(data);
          });
          streamBuffer = "";
        }
        if(!receivedAny && !streamingMessage.content && !streamingMessage.thinking){
          throw new Error("Üres válasz a modelltől.");
        }
      }
      streamingMessage.thinkingEndedAt = streamingMessage.thinkingEndedAt || Date.now();
      streamingMessage.isStreaming = false;
      if(requestToken === abortController && requestBranchId === activeBranchId){
        render();
        persistCurrent();
      } else {
        syncActiveBranch();
        persistCurrent();
      }
    }catch(error){
      var stillActive = (requestToken === abortController) && (requestBranchId === activeBranchId);
      streamingMessage.isStreaming = false;
      streamingMessage.thinkingEndedAt = streamingMessage.thinkingEndedAt || Date.now();
      if(!stillActive){
        syncActiveBranch();
        persistCurrent();
      } else if(error.name === "AbortError"){
        if(streamingMessage.content || streamingMessage.thinking){
          render();
          persistCurrent();
        }else{
          messages = messages.filter(function(message){ return message !== streamingMessage; });
          render();
        }
      }else{
        messages = messages.filter(function(message){ return message !== streamingMessage; });
        messages.push({role:"assistant", content:"Hiba: " + error.message, isError:true});
        render();
        toast(error.message || "Hiba", "err");
      }
    }finally{
      if(reader){
        try{ reader.cancel(); }catch(e){}
        try{ reader.releaseLock(); }catch(e){}
      }
      if(requestToken === abortController){
        stopThinkingClock();
        abortController = null;
        activeChatJobId = null;
        setBusy(false);
      }
    }
  }

  textarea.addEventListener("input", function(){
    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 160) + "px";
    sendButton.disabled = busy ? false : !textarea.value.trim() && !selectedImages.length;
  });
  textarea.addEventListener("keydown", function(event){
    if(event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229){
      event.preventDefault();
      send();
    }
  });
  sendButton.addEventListener("click", send);

  var btnGal = document.getElementById("btn-gal");
  var fg = document.getElementById("fg");
  if(btnGal && fg){
    btnGal.addEventListener("click", function(){ fg.click(); });
  }
  if(fg){
    fg.addEventListener("change", async function(event){
      var files = Array.prototype.slice.call(event.target.files || []);
      var imageFiles = files.filter(function(file){ return file.type.indexOf("image/") === 0; });
      if(files.length && !imageFiles.length){
        toast("Csak képfájlok tölthetők fel", "err");
        event.target.value = "";
        return;
      }
      if(files.length > imageFiles.length){
        toast("Nem képfájlok kihagyva", "inf");
      }
      var captureId = currentId;
      try{
        var results = await Promise.all(imageFiles.map(function(f){
          return imageData(f).then(function(r){ return r; }).catch(function(){ return null; });
        }));
        if(captureId !== currentId) return;
        var failed = 0;
        results.forEach(function(r){ if(r) selectedImages.push(r); else failed++; });
        if(failed) toast(failed + " kép beolvasása sikertelen", "err");
        updateImgStrip();
        sendButton.disabled = busy ? false : !textarea.value.trim() && !selectedImages.length;
      }catch(e){
        toast("Képolvasási hiba", "err");
      }
      event.target.value = "";
    });
  }

  var stb = document.getElementById("stb");
  if(stb){
    stb.addEventListener("click", function(){
      if(scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: "smooth" });
    });
  }
  if(scrollArea){
    scrollArea.addEventListener("scroll", updateScrollButton, { passive: true });
  }

   resetBranches();
   loadHistory();
  window.chatApp = {
    newConversation: newConversation,
    loadConversation: loadConversation,
    deleteConversation: deleteConversation,
    persistCurrent: persistCurrent,
    getHistory: function(){ return history; },
    getCurrentId: function(){ return currentId; },
    send: send,
    toast: toast
  };

})();
</script>

<script>
(function(){
  "use strict";

  var sbOpen = false;
  var searchOpen = false;
  var searchQuery = "";

  function $(id){ return document.getElementById(id); }

  var sidebarEl = $("sidebar");
  var contentEl = $("content");
  var sidebarBackdropEl = $("sidebar-backdrop");

  function openSB(){
    if(!sidebarEl) return;
    sbOpen = true;
    sidebarEl.classList.add("open");
    sidebarEl.setAttribute("aria-hidden", "false");
    if(sidebarBackdropEl){
      sidebarBackdropEl.classList.add("open");
      sidebarBackdropEl.setAttribute("aria-hidden", "false");
    }
    if(contentEl) contentEl.setAttribute("inert", "");
    renderHistoryList();
  }

  function closeSB(){
    if(!sidebarEl) return;
    sbOpen = false;
    sidebarEl.classList.remove("open");
    sidebarEl.setAttribute("aria-hidden", "true");
    if(sidebarBackdropEl){
      sidebarBackdropEl.classList.remove("open");
      sidebarBackdropEl.setAttribute("aria-hidden", "true");
    }
    if(contentEl) contentEl.removeAttribute("inert");
    if(searchOpen) closeSearch();
  }

  if(sidebarBackdropEl){
    sidebarBackdropEl.addEventListener("click", closeSB);
  }

  function openSearch(){
    searchOpen = true;
    var bar = $("sb-search-bar");
    if(bar) bar.classList.add("open");
    requestAnimationFrame(function(){
      var q = $("sb-q");
      if(q) q.focus();
    });
  }

  function closeSearch(){
    searchOpen = false;
    searchQuery = "";
    var q = $("sb-q");
    if(q) q.value = "";
    var bar = $("sb-search-bar");
    if(bar) bar.classList.remove("open");
    if(q) q.blur();
    renderHistoryList();
  }

  var btnSbSearch = $("btn-sb-search");
  if(btnSbSearch){
    btnSbSearch.addEventListener("click", function(){
      if(searchOpen) closeSearch(); else openSearch();
    });
  }
  var sbQCancel = $("sb-q-cancel");
  if(sbQCancel){
    sbQCancel.addEventListener("click", closeSearch);
  }

  var searchDebounce = null;
  var sbQ = $("sb-q");
  if(sbQ){
    sbQ.addEventListener("input", function(e){
      var val = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(function(){
        searchQuery = val;
        renderHistoryList();
      }, 100);
    });
  }

  function updateSearchStatus(count, q){
    var st = $("search-status");
    if(!st) return;
    if(!q){ st.textContent = ""; return; }
    st.textContent = count === 0 ? "Nincs találat: " + q : count + " találat: " + q;
  }

  function formatMeta(ts){
    if(!ts) return "";
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString("hu-HU", { month: "short", day: "numeric" });
  }

  function renderHistoryList(){
    var list = $("hlist");
    if(!list) return;
    var hist = (window.chatApp && window.chatApp.getHistory) ? window.chatApp.getHistory() : [];
    var cur = (window.chatApp && window.chatApp.getCurrentId) ? window.chatApp.getCurrentId() : null;
    var q = (searchQuery || "").trim().toLowerCase();
    var filtered = hist.filter(function(h){
      if(!q) return true;
      var title = (h.title || "").toLowerCase();
      if(title.indexOf(q) !== -1) return true;
      if(Array.isArray(h.messages)){
        for(var i = 0; i < h.messages.length; i++){
          var c = h.messages[i].content;
          var t = typeof c === "string" ? c : (Array.isArray(c) ? c.map(function(p){ return p && p.text || ""; }).join(" ") : "");
          if(String(t).toLowerCase().indexOf(q) !== -1) return true;
        }
      }
      return false;
    });
    updateSearchStatus(filtered.length, q);
    if(!filtered.length){
      list.innerHTML = '<div class="h-empty"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><p>' + (q ? "Nincs találat" : "Még nincsenek beszélgetések") + '</p></div>';
      return;
    }
    list.innerHTML = filtered.map(function(h){
      var active = h.id === cur ? " active" : "";
      var pinned = h.pinned ? " pinned" : "";
      var rawTitle = h.title || "Beszélgetés";
      var meta = formatMeta(h.updated);
      var markTitle;
      if(q){
        var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
        var parts = [];
        var last = 0;
        var match;
        while((match = re.exec(rawTitle)) !== null){
          parts.push(escapeHtmlAttr(rawTitle.slice(last, match.index)));
          parts.push("<mark>" + escapeHtmlAttr(match[0]) + "</mark>");
          last = match.index + match[0].length;
        }
        parts.push(escapeHtmlAttr(rawTitle.slice(last)));
        markTitle = parts.join("");
      } else {
        markTitle = escapeHtmlAttr(rawTitle);
      }
      return '<div class="hcard' + active + pinned + '" data-id="' + escapeHtmlAttr(h.id) + '" role="button" tabindex="0">' +
        '<div class="hcard-body"><div class="hcard-pre"><span class="hcard-pin"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg></span>' + markTitle + '</div>' +
        '<div class="hcard-meta">' + escapeHtmlAttr(meta) + '</div></div>' +
        '<button type="button" class="hcard-del" data-id="' + escapeHtmlAttr(h.id) + '" aria-label="Törlés"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button></div>';
    }).join("");

    list.querySelectorAll(".hcard").forEach(function(card){
      card.addEventListener("click", function(e){
        if(e.target.closest(".hcard-del")) return;
        var id = card.getAttribute("data-id");
        if(id && window.chatApp) window.chatApp.loadConversation(id);
      });
      card.addEventListener("contextmenu", function(e){
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, card.getAttribute("data-id"));
      });
    });
    list.querySelectorAll(".hcard-del").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        openActionSheet("Beszélgetés törlése", "Biztosan törölni szeretnéd?", [
          { label: "Törlés", destructive: true, action: function(){ if(window.chatApp) window.chatApp.deleteConversation(id); } }
        ]);
      });
    });
  }

  function escapeHtmlAttr(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
    });
  }

  function openActionSheet(title, message, options){
    var sheet = $("action-sheet");
    var titleEl = $("as-title");
    var msgEl = $("as-message");
    var titleBlock = $("as-title-block");
    var optsEl = $("as-options");
    if(!sheet || !optsEl) return;
    if(titleEl) titleEl.textContent = title || "";
    if(msgEl){
      if(message){ msgEl.textContent = message; msgEl.style.display = ""; }
      else { msgEl.style.display = "none"; }
    }
    if(titleBlock) titleBlock.style.display = title ? "" : "none";
    optsEl.innerHTML = "";
    (options || []).forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "as-option" + (opt.destructive ? " destructive" : "");
      b.textContent = opt.label;
      b.addEventListener("click", function(){
        closeActionSheet();
        if(typeof opt.action === "function") opt.action();
      });
      optsEl.appendChild(b);
    });
    sheet.setAttribute("aria-hidden", "false");
  }

  function closeActionSheet(){
    var sheet = $("action-sheet");
    if(sheet) sheet.setAttribute("aria-hidden", "true");
  }

  var asCancel = $("as-cancel");
  if(asCancel) asCancel.addEventListener("click", closeActionSheet);
  var asBackdrop = $("as-backdrop");
  if(asBackdrop) asBackdrop.addEventListener("click", closeActionSheet);

  function showCtxMenu(x, y, id){
    var menu = $("ctx-menu");
    var overlay = $("ctx-overlay");
    if(!menu || !overlay) return;
    var isPinned = false;
    var hist = window.chatApp && window.chatApp.getHistory ? window.chatApp.getHistory() : [];
    for(var i = 0; i < hist.length; i++){
      if(hist[i].id === id){ isPinned = !!hist[i].pinned; break; }
    }
    var pinLabel = isPinned ? "Kitűzés feloldása" : "Kitűzés";
    menu.innerHTML =
      '<button type="button" class="ctx-item" data-act="open"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>Megnyitás</button>' +
      '<button type="button" class="ctx-item" data-act="pin"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>' + pinLabel + '</button>' +
      '<button type="button" class="ctx-item danger" data-act="del"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Törlés</button>';
    menu.style.left = Math.min(x, window.innerWidth - 220) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 160) + "px";
    menu.classList.add("vis");
    overlay.classList.add("vis");
    menu.querySelectorAll(".ctx-item").forEach(function(item){
      item.addEventListener("click", function(){
        var act = item.getAttribute("data-act");
        hideCtxMenu();
        if(act === "open" && window.chatApp) window.chatApp.loadConversation(id);
        if(act === "del"){
          openActionSheet("Beszélgetés törlése", "Biztosan törölni szeretnéd?", [
            { label: "Törlés", destructive: true, action: function(){ if(window.chatApp) window.chatApp.deleteConversation(id); } }
          ]);
        }
        if(act === "pin"){
          var hist2 = window.chatApp && window.chatApp.getHistory ? window.chatApp.getHistory() : [];
          for(var j = 0; j < hist2.length; j++){
            if(hist2[j].id === id){ hist2[j].pinned = !hist2[j].pinned; break; }
          }
          try{ localStorage.setItem("chat_history_v1", JSON.stringify(hist2)); }catch(e){}
          renderHistoryList();
        }
      });
    });
  }

  function hideCtxMenu(){
    var menu = $("ctx-menu");
    var overlay = $("ctx-overlay");
    if(menu) menu.classList.remove("vis");
    if(overlay) overlay.classList.remove("vis");
  }

  var ctxOverlay = $("ctx-overlay");
  if(ctxOverlay) ctxOverlay.addEventListener("click", hideCtxMenu);

  var sbBody = document.querySelector(".sb-body");
  if(sbBody){
    var pullArmed = false;
    var pullStartY = 0;
    sbBody.addEventListener("touchstart", function(e){
      if(sbBody.scrollTop <= 0 && !searchOpen){
        pullArmed = true;
        pullStartY = e.touches[0].clientY;
      } else {
        pullArmed = false;
      }
    }, { passive: true });

    sbBody.addEventListener("touchmove", function(e){
      if(!pullArmed) return;
      var dy = e.touches[0].clientY - pullStartY;
      if(dy > 12){
        sidebarEl.classList.add("pull-hinting");
      }
      if(dy > 72){
        openSearch();
        pullArmed = false;
        sidebarEl.classList.remove("pull-hinting");
      }
    }, { passive: true });

    function disarmPull(){
      pullArmed = false;
      sidebarEl.classList.remove("pull-hinting");
    }
    sbBody.addEventListener("touchend", disarmPull, { passive: true });
    sbBody.addEventListener("touchcancel", disarmPull, { passive: true });
  }

  (function(){
    var touchId = null;
    var startX = 0, startY = 0, lastDx = 0;
    var dir = null;
    var w = 0;

    document.addEventListener("touchstart", function(e){
      if(touchId !== null) return;
      var t = e.changedTouches[0];
      if(!sbOpen && t.clientX > 40) return;
      var target = e.target;
      if(target && target.closest){
        if(target.closest(".cb pre, .md-table-scroll, .img-strip, .src-chips, #ta, input, textarea, .lightbox-stage")){
          return;
        }
      }
      touchId = t.identifier;
      startX = t.clientX;
      startY = t.clientY;
      lastDx = 0;
      dir = null;
      w = (sidebarEl && sidebarEl.getBoundingClientRect().width) || window.innerWidth;
    }, { passive: true });

    document.addEventListener("touchmove", function(e){
      if(touchId === null) return;
      var t = null;
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === touchId){ t = e.changedTouches[i]; break; }
      }
      if(!t) return;
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      lastDx = dx;

      if(dir === null){
        if(Math.abs(dx) + Math.abs(dy) >= 6){
          dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
        }
      }
      if(dir === "v"){
        touchId = null;
        return;
      }
      if(dir === "h"){
        if(!sbOpen && startX <= 40 && dx > 0){
          sidebarEl.classList.add("dragging");
          var pct = Math.min(0, -100 + (dx / w) * 100);
          sidebarEl.style.transform = "translateX(" + pct + "%)";
        } else if(sbOpen && dx < 0){
          sidebarEl.classList.add("dragging");
          var pct2 = Math.max(-100, (dx / w) * 100);
          sidebarEl.style.transform = "translateX(" + pct2 + "%)";
        }
      }
    }, { passive: true });

    document.addEventListener("touchend", function(e){
      if(touchId === null) return;
      var found = false;
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === touchId){ found = true; break; }
      }
      if(!found) return;

      sidebarEl.classList.remove("dragging");
      sidebarEl.style.transform = "";
      var threshold = Math.max(80, Math.min(w * 0.18, 140));
      if(!sbOpen && lastDx > threshold){
        openSB();
      } else if(sbOpen && lastDx < -threshold){
        closeSB();
      }
      touchId = null;
      dir = null;
      lastDx = 0;
    }, { passive: true });

    document.addEventListener("touchcancel", function(){
      if(touchId === null) return;
      sidebarEl.classList.remove("dragging");
      sidebarEl.style.transform = "";
      touchId = null;
      dir = null;
      lastDx = 0;
    }, { passive: true });
  })();

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(document.getElementById("action-sheet") && document.getElementById("action-sheet").getAttribute("aria-hidden") === "false") closeActionSheet();
      else if(document.getElementById("ctx-menu") && document.getElementById("ctx-menu").classList.contains("vis")) hideCtxMenu();
      else if(sbOpen) closeSB();
      else if(searchOpen) closeSearch();
    } else if((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
      e.preventDefault();
      if(sbOpen) closeSB(); else openSB();
    }
  });

  var btnSbNew = $("btn-sb-new");
  if(btnSbNew){
    btnSbNew.addEventListener("click", function(){
      if(window.chatApp) window.chatApp.newConversation();
      else closeSB();
    });
  }

  var ta = $("ta");
  if(ta){
    ta.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.stopPropagation();
      }
    });
  }

  window.openSB = openSB;
  window.closeSB = closeSB;
  window.openSearch = openSearch;
  window.closeSearch = closeSearch;
  window.renderHistoryList = renderHistoryList;

  renderHistoryList();

  (function setupBrowserKeyboard(){
    if(!window.visualViewport) return;
    var lastH = 0;
    var nativeManaged = false;
    window.__keyboardNativeManaged = function(v){ nativeManaged = !!v; };
    function sync(){
      if(nativeManaged) return;
      var vv = window.visualViewport;
      var occluded = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      var wrap = document.getElementById("ib-wrap");
      if(!wrap) return;
      if(occluded > 40){
        document.documentElement.style.setProperty("--native-keyboard-height", occluded + "px");
        wrap.classList.add("keyboard-open");
      } else {
        document.documentElement.style.setProperty("--native-keyboard-height", "0px");
        wrap.classList.remove("keyboard-open");
      }
      if(Math.abs(occluded - lastH) > 2){
        lastH = occluded;
        if(typeof scheduleBridgeFlush === "function") scheduleBridgeFlush();
      }
    }
    window.visualViewport.addEventListener("resize", sync, { passive: true });
    window.visualViewport.addEventListener("scroll", sync, { passive: true });
  })();
})();
</script>


<script>
(() => {
  "use strict";

  const PROFILE = {
    refThickness: 20, refFactor: 1.4, refDispersion: 7,
    refFresnelRange: 30, refFresnelHardness: 20, refFresnelFactor: 20,
    glareRange: 30, glareHardness: 20, glareFactor: 28,
    glareConvergence: 73.66, glareOppositeFactor: 40, glareAngle: -45,
    blurRadius: 0, blurEdge: false,
    tint: { r: 255, g: 255, b: 255, a: 0 },
    shadowExpand: 25, shadowFactor: 15, shadowPosition: { x: 0, y: -10 },
    bgType: 3, shapeWidth: 200, shapeHeight: 200, shapeRadius: 80,
    shapeRoundness: 5, mergeRate: 0.05, showShape1: true,
    springSizeFactor: 10, step: 0
  };
  const MAX_SHAPES = 48;
  const KERNEL_MAX = 201;

  const canvas = document.getElementById("glass-renderer-canvas");
  if(!canvas) return;

  function restoreGlassFallback(){
    var style = document.createElement("style");
     style.textContent = ".glass-host,.lg,.samasante-glass-button,#sidebar,.ibox,.ctx-menu,.as-group,.as-cancel,.cb,.toast,#stb,.src-chip,.srch-bar,.file-chip,.sb-si,.sb-new,.u .bubble,.hcard.active,.rcn-bar{background:linear-gradient(145deg,var(--liquid2),var(--liquid3) 48%,var(--liquid))!important;border:.45px solid var(--liquid-border)!important;box-shadow:0 .7px 0 var(--liquid-inset) inset,0 -.45px 0 rgba(0,0,0,.14) inset,0 0 0 .35px rgba(80,90,255,.07),0 14px 42px var(--liquid-shadow)!important;-webkit-backdrop-filter:blur(36px) saturate(190%) contrast(1.08) brightness(1.04)!important;backdrop-filter:blur(36px) saturate(190%) contrast(1.08) brightness(1.04)!important;}";
    document.head.appendChild(style);
  }

  const gl = canvas.getContext("webgl2", { alpha: true, antialias: true, premultipliedAlpha: true, desynchronized: true });
  if(!gl){ restoreGlassFallback(); return; }
  if(!gl.getExtension("EXT_color_buffer_float")){ restoreGlassFallback(); return; }

  const VS_SRC = `#version 300 es
  precision highp float;
  out vec2 vUv;
  void main(){
    vec2 P[3];
    P[0] = vec2(-1.0, -1.0);
    P[1] = vec2( 3.0, -1.0);
    P[2] = vec2(-1.0,  3.0);
    vec2 p = P[gl_VertexID];
    vUv = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
  }`;

  const BG_FS_SRC = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;
  uniform vec2 uRes;
  uniform float uTime;

  vec3 pal(float t){
    return vec3(0.04,0.06,0.16) + 0.18*cos(6.28318*(vec3(0.22,0.32,0.45)*t + vec3(0.55,0.65,0.75)));
  }

  void main(){
    vec2 p = (vUv - 0.5) * vec2(uRes.x/uRes.y, 1.0);
    float t = uTime * 0.045;
    vec3 c = vec3(0.02,0.024,0.05);
    for(int i = 0; i < 4; i++){
      float f = float(i);
      vec2 d = vec2(sin(t*0.2 + f*1.7), cos(t*0.17 + f*1.3)) * 0.42;
      float m = 1.0 - smoothstep(0.0, 1.0, length(p - d));
      c += pal(f*0.17 + t*0.03) * m * 0.35;
    }
    c *= 0.9 + 0.18*pow(vUv.x*(1.0-vUv.x)*vUv.y*(1.0-vUv.y)*16.0, 0.18);
    fragColor = vec4(c, 1.0);
  }`;

  const BLUR_FS_SRC = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;
  uniform sampler2D uTex;
  uniform vec2 uTexel;
  uniform vec2 uDir;
  uniform float uWeights[201];
  uniform int uRadius;

  void main(){
    vec4 sum = texture(uTex, vUv) * uWeights[0];
    for(int i = 1; i <= 200; i++){
      if(i > uRadius) break;
      vec2 o = uTexel * uDir * float(i);
      sum += texture(uTex, vUv + o) * uWeights[i];
      sum += texture(uTex, vUv - o) * uWeights[i];
    }
    fragColor = sum;
  }`;

  const MAIN_FS_SRC = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;

  uniform sampler2D uBg;
  uniform sampler2D uBlur;
  uniform vec2 uRes;
  uniform float uDpr;
  uniform float uTime;
  uniform int uShapeCount;
  uniform vec4 uRects[48];
  uniform float uRadii[48];
  uniform float uThickness;
  uniform float uRefFactor;
  uniform float uDispersion;
  uniform float uFresnelRange;
  uniform float uFresnelHardness;
  uniform float uFresnelFactor;
  uniform float uGlareRange;
  uniform float uGlareHardness;
  uniform float uGlareFactor;
  uniform float uGlareConvergence;
  uniform float uGlareOppositeFactor;
  uniform float uGlareAngle;
  uniform vec4 uTint;
  uniform int uStep;

  float sdRoundRect(vec2 p, vec2 b, float r){
    vec2 q = abs(p) - b + vec2(r);
    return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
  }

  float sdfScene(vec2 px, out int hitIdx){
    float best = 1e9;
    hitIdx = -1;
    for(int i = 0; i < 48; i++){
      if(i >= uShapeCount) break;
      vec4 rc = uRects[i];
      vec2 center = rc.xy + rc.zw * 0.5;
      vec2 half_ = max(rc.zw * 0.5 - 1.0, vec2(1.0));
      float r = max(1.0, uRadii[i]);
      float d = sdRoundRect(px - center, half_, r);
      if(d < best){
        best = d;
        hitIdx = i;
      }
    }
    return best;
  }

  vec2 nrm(vec2 px){
    float eps = max(1.0, uDpr) + 1e-6;
    int hi;
    float dx = sdfScene(px + vec2(eps, 0.0), hi) - sdfScene(px - vec2(eps, 0.0), hi);
    float dy = sdfScene(px + vec2(0.0, eps), hi) - sdfScene(px - vec2(0.0, eps), hi);
    vec2 g = vec2(dx, dy);
    float len = length(g);
    return len > 1e-6 ? g / len : vec2(0.0, -1.0);
  }

  void main(){
    vec2 px = vUv * uRes;
    vec3 bg = texture(uBg, vUv).rgb;
    vec3 blur = texture(uBlur, vUv).rgb;

    int hi;
    float sdf = sdfScene(px, hi);

    if(hi < 0){
      fragColor = vec4(bg, 1.0);
      return;
    }

    vec2 n = nrm(px);
    float inside = step(sdf, 0.0);
    float edgeBand = 1.0 - smoothstep(0.0, max(1.0, uThickness), abs(sdf));
    float edge = inside * edgeBand;
    float incidence = clamp(1.0 - abs(dot(n, vec2(0.0, -1.0))), 0.0, 1.0);
    float ref = edge * incidence * uRefFactor;
    vec2 off = (n * ref * 14.0) / uRes;
    float disp = uDispersion / max(uRes.x, uRes.y);

    float rC = texture(uBlur, vUv + off*0.98 + n*disp*0.98).r;
    float gC = texture(uBlur, vUv + off*1.00).g;
    float bC = texture(uBlur, vUv + off*1.02 - n*disp*1.02).b;
    vec3 refr = vec3(rC, gC, bC);

    vec3 glass = mix(blur, refr, 0.92);

    float fresBand = 1.0 - smoothstep(0.0, max(1.0, uFresnelRange), abs(sdf));
    float fres = pow(clamp(fresBand, 0.0, 1.0), max(0.001, uFresnelHardness*0.15)) * (uFresnelFactor/20.0);
    vec3 fresCol = mix(vec3(0.08, 0.12, 0.28), uTint.rgb, uTint.a);

    vec2 gd = normalize(vec2(cos(radians(uGlareAngle)), sin(radians(uGlareAngle))));
    float ndg = max(dot(n, gd), 0.0);
    float glareBand = 1.0 - smoothstep(0.0, max(1.0, uGlareRange), abs(sdf));
    float glare = pow(edge * glareBand * smoothstep(0.0, 1.0, ndg), max(0.001, uGlareHardness*0.15)) * (uGlareFactor/90.0);
    glare *= mix(uGlareOppositeFactor/100.0, 1.0, ndg);
    glare *= smoothstep(0.0, 1.0, uGlareConvergence/100.0 + 0.25);

    vec3 comp = mix(bg, mix(glass, fresCol, clamp(fres*0.04, 0.0, 0.15)) + vec3(0.1, 0.15, 0.35)*glare*0.04, inside);

    if(uStep == 1){ fragColor = vec4(vec3(clamp(0.5 - sdf/80.0, 0.0, 1.0)), 1.0); return; }
    if(uStep == 2){ fragColor = vec4(n*0.5+0.5, 0.0, 1.0); return; }
    if(uStep == 3){ fragColor = vec4(vec3(edge), 1.0); return; }
    if(uStep == 4){ fragColor = vec4(blur, 1.0); return; }
    if(uStep == 5){ fragColor = vec4(refr, 1.0); return; }
    if(uStep == 6){ fragColor = vec4(vec3(fres), 1.0); return; }
    if(uStep == 7){ fragColor = vec4(vec3(glare), 1.0); return; }
    if(uStep == 8){ fragColor = vec4(vec3(inside), 1.0); return; }
    if(uStep == 9){ fragColor = vec4(bg, 1.0); return; }

    fragColor = vec4(comp, 1.0);
  }`;

  function sh(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      const log = gl.getShaderInfoLog(s);
      gl.deleteShader(s);
      throw new Error(log);
    }
    return s;
  }

  function prog(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
      const log = gl.getProgramInfoLog(p);
      gl.deleteProgram(p);
      throw new Error(log);
    }
    return p;
  }

  function tex(w, h){
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  function fbo(w, h){
    const texture = tex(w, h);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, texture, w, h };
  }

  function kernel(radius){
    const arr = new Float32Array(KERNEL_MAX);
    if(radius <= 0){
      arr[0] = 1;
      return arr;
    }
    const sigma = Math.max(radius/3, 0.001);
    let sum = 0;
    for(let i = 0; i <= radius && i < KERNEL_MAX; i++){
      const w = Math.exp(-(i*i)/(2*sigma*sigma));
      arr[i] = w;
      sum += (i === 0) ? w : w*2;
    }
    if(sum > 0){
      for(let i = 0; i < KERNEL_MAX; i++) arr[i] /= sum;
    }
    return arr;
  }

  function uloc(program, names){
    const out = {};
    for(const n of names){
      out[n] = gl.getUniformLocation(program, n);
    }
    return out;
  }

  class MultiPassRenderer{
    constructor(){
      const vs = sh(gl.VERTEX_SHADER, VS_SRC);
      const bgFs = sh(gl.FRAGMENT_SHADER, BG_FS_SRC);
      const blurFs = sh(gl.FRAGMENT_SHADER, BLUR_FS_SRC);
      const mainFs = sh(gl.FRAGMENT_SHADER, MAIN_FS_SRC);

      this.bgProg = prog(vs, bgFs);
      this.blurProg = prog(vs, blurFs);
      this.mainProg = prog(vs, mainFs);

      this.bgU = uloc(this.bgProg, ["uRes","uTime"]);
      this.blurU = uloc(this.blurProg, ["uTex","uTexel","uDir","uWeights","uRadius"]);
      this.mainU = uloc(this.mainProg, [
        "uBg","uBlur","uRes","uDpr","uTime","uShapeCount","uRects","uRadii",
        "uThickness","uRefFactor","uDispersion","uFresnelRange","uFresnelHardness","uFresnelFactor",
        "uGlareRange","uGlareHardness","uGlareFactor","uGlareConvergence","uGlareOppositeFactor","uGlareAngle",
        "uTint","uStep"
      ]);

      this.rects = new Float32Array(MAX_SHAPES*4);
      this.radii = new Float32Array(MAX_SHAPES);
      this.count = 0;
      this.radius = Math.max(0, Math.min(200, PROFILE.blurRadius|0));
      this.weights = kernel(this.radius);
      this._radCache = new WeakMap();
      this._lastCollect = 0;

      this.vao = gl.createVertexArray();
      gl.bindVertexArray(this.vao);

      this.bg = null; this.vb = null; this.hb = null;
      this.resize();
    }

    resize(){
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      const w = Math.max(1, Math.round(window.innerWidth * dpr));
      const h = Math.max(1, Math.round(window.innerHeight * dpr));
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      this.dpr = dpr;

      if(!this.bg){
        this.bg = fbo(w, h);
        this.vb = fbo(w, h);
        this.hb = fbo(w, h);
      } else {
        [this.bg, this.vb, this.hb].forEach((f) => {
          gl.bindTexture(gl.TEXTURE_2D, f.texture);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
          f.w = w; f.h = h;
        });
      }
    }

    collect(){
      const SEL = ".glass-host, .lg, .samasante-glass-button, #sidebar, .ibox, .ctx-menu, .as-group, .as-cancel, .cb, .toast, #stb, .src-chip, .srch-bar, .file-chip, .sb-si, .sb-new, .u .bubble, .hcard.active, .rcn-bar";
      let list;
      try{ list = document.querySelectorAll(SEL); }
      catch(e){ list = []; }

      const seen = new Set();
      let idx = 0;
      const dpr = this.dpr;

      for(let i = 0; i < list.length && idx < MAX_SHAPES; i++){
        const el = list[i];
        if(seen.has(el)) continue;
        seen.add(el);
        const cs = window.getComputedStyle(el);
        if(cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity) === 0) continue;
        let anc = el.parentElement;
        let skip = false;
        let effOp = parseFloat(cs.opacity);
        if(!isFinite(effOp)) effOp = 1;
        while(anc && anc !== document.documentElement){
          const acs = window.getComputedStyle(anc);
          if(acs.display === "none" || acs.visibility === "hidden"){ skip = true; break; }
          const aop = parseFloat(acs.opacity);
          if(isFinite(aop)) effOp *= aop;
          if(effOp < 0.01){ skip = true; break; }
          anc = anc.parentElement;
        }
        if(skip) continue;
        const rect = el.getBoundingClientRect();
        if(rect.width < 8 || rect.height < 8) continue;
        if(rect.bottom < 0 || rect.top > window.innerHeight || rect.right < 0 || rect.left > window.innerWidth) continue;

        var cssH = canvas.clientHeight || window.innerHeight;
        this.rects[idx*4+0] = rect.left * dpr;
        this.rects[idx*4+1] = (cssH - rect.bottom) * dpr;
        this.rects[idx*4+2] = rect.width * dpr;
        this.rects[idx*4+3] = rect.height * dpr;

        let r = this._radCache.get(el);
        if(r === undefined){
          r = parseFloat(cs.borderTopLeftRadius);
          if(!isFinite(r)) r = 20;
          this._radCache.set(el, r);
        }
        this.radii[idx] = r * dpr;

        idx++;
      }
      this.count = idx;
    }

    bgPass(t){
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.bg.fb);
      gl.viewport(0, 0, this.bg.w, this.bg.h);
      gl.useProgram(this.bgProg);
      gl.uniform2f(this.bgU.uRes, this.bg.w, this.bg.h);
      gl.uniform1f(this.bgU.uTime, t);
      gl.bindVertexArray(this.vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    blurPass(src, dst, dir){
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
      gl.viewport(0, 0, dst.w, dst.h);
      gl.useProgram(this.blurProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, src.texture);
      gl.uniform1i(this.blurU.uTex, 0);
      gl.uniform2f(this.blurU.uTexel, 1/src.w, 1/src.h);
      gl.uniform2f(this.blurU.uDir, dir[0], dir[1]);
      gl.uniform1fv(this.blurU.uWeights, this.weights);
      gl.uniform1i(this.blurU.uRadius, this.radius);
      gl.bindVertexArray(this.vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    mainPass(t){
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(this.mainProg);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.bg.texture);
      gl.uniform1i(this.mainU.uBg, 0);

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.hb.texture);
      gl.uniform1i(this.mainU.uBlur, 1);

      const dpr = this.dpr;
      gl.uniform2f(this.mainU.uRes, canvas.width, canvas.height);
      gl.uniform1f(this.mainU.uDpr, dpr);
      gl.uniform1f(this.mainU.uTime, t);
      gl.uniform1i(this.mainU.uShapeCount, this.count);
      gl.uniform4fv(this.mainU.uRects, this.rects);
      gl.uniform1fv(this.mainU.uRadii, this.radii);
      gl.uniform1f(this.mainU.uThickness, PROFILE.refThickness * dpr);
      gl.uniform1f(this.mainU.uRefFactor, PROFILE.refFactor);
      gl.uniform1f(this.mainU.uDispersion, PROFILE.refDispersion * dpr);
      gl.uniform1f(this.mainU.uFresnelRange, PROFILE.refFresnelRange * dpr);
      gl.uniform1f(this.mainU.uFresnelHardness, PROFILE.refFresnelHardness);
      gl.uniform1f(this.mainU.uFresnelFactor, PROFILE.refFresnelFactor);
      gl.uniform1f(this.mainU.uGlareRange, PROFILE.glareRange * dpr);
      gl.uniform1f(this.mainU.uGlareHardness, PROFILE.glareHardness);
      gl.uniform1f(this.mainU.uGlareFactor, PROFILE.glareFactor);
      gl.uniform1f(this.mainU.uGlareConvergence, PROFILE.glareConvergence);
      gl.uniform1f(this.mainU.uGlareOppositeFactor, PROFILE.glareOppositeFactor);
      gl.uniform1f(this.mainU.uGlareAngle, PROFILE.glareAngle);
      gl.uniform4f(this.mainU.uTint, PROFILE.tint.r/255, PROFILE.tint.g/255, PROFILE.tint.b/255, PROFILE.tint.a);
      gl.uniform1i(this.mainU.uStep, PROFILE.step|0);

      gl.bindVertexArray(this.vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    frame(t){
      if(t - this._lastCollect >= 600){
        this.collect();
        this._lastCollect = t;
      }
      this.bgPass(t*0.001);
      var stepVal = (PROFILE.step|0);
      if(this.count > 0 && (stepVal === 0 || stepVal === 4 || stepVal === 5)){
        this.blurPass(this.bg, this.vb, [0, 1]);
        this.blurPass(this.vb, this.hb, [1, 0]);
      }
      this.mainPass(t*0.001);
    }
  }

  let renderer;
  try{
    renderer = new MultiPassRenderer();
  }catch(e){
    restoreGlassFallback();
    return;
  }

  let rafHandle = null;

  function loop(t){
    renderer.frame(t);
    rafHandle = requestAnimationFrame(loop);
  }
  rafHandle = requestAnimationFrame(loop);

  window.addEventListener("resize", () => { renderer.resize(); }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      if(rafHandle !== null){
        cancelAnimationFrame(rafHandle);
        rafHandle = null;
      }
    } else {
      if(rafHandle === null){
        rafHandle = requestAnimationFrame(loop);
      }
    }
  });
})();
</script>


<script>
(function(){
  "use strict";
  function markLiquidGlassButtons(root){
    var scope = root && root.querySelectorAll ? root : document;
    var nodes = scope.querySelectorAll("button:not([data-liquid-glass='off'])");
    for(var i = 0; i < nodes.length; i++){
      nodes[i].classList.add("samasante-glass-button");
    }
  }
  markLiquidGlassButtons(document);
  if(typeof MutationObserver !== "undefined" && document.body){
    new MutationObserver(function(records){
      for(var i = 0; i < records.length; i++){
        for(var j = 0; j < records[i].addedNodes.length; j++){
          var node = records[i].addedNodes[j];
          if(node.nodeType === 1){
            if(node.matches && node.matches("button:not([data-liquid-glass='off'])")){
              node.classList.add("samasante-glass-button");
            }
            markLiquidGlassButtons(node);
          }
        }
      }
    }).observe(document.body, { childList: true, subtree: true });
  }
  function bindSpringPress(){
    if(typeof GlassKit === "undefined" || !GlassKit.Spring){
      setTimeout(bindSpringPress, 40);
      return;
    }
    var sels = ".sbtn, .ibtn, .sb-new, .hcard, #stb, .as-option, .as-cancel, .ctx-item, .sb-close";
    var nodes = document.querySelectorAll(sels);
    for(var i = 0; i < nodes.length; i++){
      (function(el){
        if(el._gkSpringBound) return;
        el._gkSpringBound = true;
        var spring = GlassKit.Spring.snappy(1);
        var raf = null;
        function tick(){
          spring.advance(1/60);
          var s = spring.position;
          el.style.transform = "scale(" + s.toFixed(4) + ")";
          if(!spring.settled()){
            raf = requestAnimationFrame(tick);
          } else {
            el.style.transform = "";
            raf = null;
          }
        }
        el.addEventListener("pointerdown", function(){
          spring.setTarget(0.94);
          if(!raf) raf = requestAnimationFrame(tick);
        }, {passive:true});
        el.addEventListener("pointerup", function(){ spring.setTarget(1); }, {passive:true});
        el.addEventListener("pointercancel", function(){ spring.setTarget(1); }, {passive:true});
        el.addEventListener("pointerleave", function(){ spring.setTarget(1); }, {passive:true});
      })(nodes[i]);
    }
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", bindSpringPress);
  } else {
    bindSpringPress();
  }
  var hlist = document.getElementById("hlist");
  if(hlist && typeof MutationObserver !== "undefined"){
    new MutationObserver(function(){ bindSpringPress(); }).observe(hlist, {childList:true, subtree:true});
  }
})();
</script>
