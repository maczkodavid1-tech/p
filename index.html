<style>
html, body, #app{
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}
input, textarea, select, [contenteditable="true"]{
  font-size: 16px !important;
  max-height: 100%;
}

:root{
  color-scheme: dark;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --blue: #0000ff;              --blue-l: #00ff00;
  --accent: #0000ff;            --green-soft: #ffffff;
  --fg: #f5f5f7;                --fg2: rgba(245,245,247,.58);
  --fg3: rgba(245,245,247,.28); --bg: #000000;
  --sep: rgba(255,255,255,.055);--hover: rgba(255,255,255,.055);
  --liquid: rgba(246,246,250,.018);
  --liquid2: rgba(0,40,218,.033);
  --liquid3: rgba(255,255,255,.015);
  --liquid-border: rgba(0,0,0,.068);
  --liquid-border-strong: rgba(232,232,246,.118);
  --liquid-inset: rgba(255,255,255,.105);
  --liquid-edge: rgba(255,255,255,.08);
  --liquid-shadow: rgba(0,0,10,.34);
  --input-glow: rgba(11,0,246,.118);
  --send-border: rgba(0,9,205,.22);
  --send-inset: rgba(255,255,255,.18);
  --send-shadow: rgba(80,90,255,.18);
}

*{ box-sizing: border-box; margin: 0; padding: 0; }
html{
  width: 100%; height: 100%; overflow: hidden;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
  margin: 0; padding: 0;
}
body{
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--fg);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  touch-action: pan-y;
  margin: 0; padding: 0;
}
input, textarea, [contenteditable="true"], .bubble, .ai-bubble, .bubble *, .ai-bubble *, pre, code, .cb, .cb *{
  -webkit-user-select: text; user-select: text;
  -webkit-touch-callout: default;
}
button, a, label, summary, svg, img{
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-user-drag: none;
}
button, input, textarea{ font: inherit; appearance: none; -webkit-appearance: none; }
textarea{ border-radius: 0; }

#bg{
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: #000000;
}
#bg::before{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg,#4b6cf7 0%,#000 50%,#0009cd 100%);
  opacity: .15;
  filter: blur(80px);
}
#bg::after{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.98));
}

#app{
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  width: 100%; height: 100%;
  overflow: hidden;
}

.lg{
  position: relative; overflow: hidden; isolation: isolate;
  transform: translateZ(0);
  background: linear-gradient(145deg, var(--liquid2), var(--liquid3) 48%, var(--liquid));
  border: .45px solid var(--liquid-border);
  box-shadow: 0 .7px 0 var(--liquid-inset) inset, 0 -.45px 0 rgba(0,0,0,.14) inset, 0 0 0 .35px rgba(80,90,255,.07), 0 14px 42px var(--liquid-shadow);
  -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
  backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
}
.lg:before{
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(150deg, rgba(255,255,255,.105), rgba(255,255,255,.022) 34%, rgba(80,90,255,.035) 58%, rgba(11,0,246,.025));
  mix-blend-mode: screen;
}
.lg:after{
  content: "";
  position: absolute; inset: .5px;
  border-radius: inherit;
  pointer-events: none;
  border: .35px solid rgba(255,255,255,.035);
  box-shadow: 0 0 18px rgba(80,90,255,.04) inset;
}
.lg > *{ position: relative; z-index: 1; }

#sidebar{
  position: fixed; top: 0; bottom: 0; left: 0; right: 0;
  width: 100%; max-width: 100%;
  z-index: 310;
  padding-top: var(--sat); padding-left: var(--sal); padding-right: var(--sar);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .42s cubic-bezier(.32,.72,0,1.18);
  will-change: transform;
  background: rgba(2,8,5,.18);
  -webkit-backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
  backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
  transform-style: preserve-3d;
}
#sidebar.open{ transform: translateX(0); }
#sidebar.dragging{ transition: none; }
#sidebar[aria-hidden="true"]{ pointer-events: none; }
#sidebar[aria-hidden="false"]{ pointer-events: auto; }

.sb-backdrop{
  position: fixed; inset: 0; z-index: 309;
  background: rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none;
  transition: opacity .35s cubic-bezier(.25,1,.5,1);
}
.sb-backdrop.open{ opacity: 1; pointer-events: auto; }

.sb-hdr{
  height: 52px; display: flex; align-items: center;
  padding: 0 12px;
  border-bottom: .5px solid var(--sep);
  gap: 8px; flex-shrink: 0;
}
.sb-title{
  flex: 1; text-align: center;
  font-size: 15px; font-weight: 600; letter-spacing: -.3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-close{
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg2);
}
.sb-close:active{ transform: scale(.88); opacity: .7; }
.sb-close svg{ width: 17px; height: 17px; }

#sb-search-bar{
  height: 0; visibility: hidden; overflow: hidden;
  transition: height .32s cubic-bezier(.34,1.28,.64,1), visibility .32s;
}
#sb-search-bar.open{ height: 54px; visibility: visible; }

.sb-si{
  height: 38px; margin: 8px 14px 6px; border-radius: 18px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
}
.sb-si svg{ width: 16px; height: 16px; fill: var(--fg3); flex-shrink: 0; }

#sb-q{
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 16px !important; color: var(--fg); min-width: 0;
}
#sb-q::placeholder{ color: var(--fg3); }

#sb-q-cancel{
  background: transparent; border: none; color: var(--green-soft);
  font-size: 15px; width: 0; opacity: 0; pointer-events: none; overflow: hidden;
  transition: width .2s, opacity .2s; white-space: nowrap;
}
#sb-search-bar.open #sb-q-cancel{ width: 52px; opacity: 1; pointer-events: auto; }

.sb-body{
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 12px;
}
.sb-body::-webkit-scrollbar, #scroll-area::-webkit-scrollbar, .img-strip::-webkit-scrollbar, .src-chips::-webkit-scrollbar, #ta::-webkit-scrollbar{
  display: none;
}
.sb-body, #scroll-area, .img-strip, .src-chips, #ta{
  scrollbar-width: none;
}

.sb-pull-hint{
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 6px 0 0; font-size: 11px; color: var(--fg3);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sb-pull-hint svg{ width: 12px; height: 12px; }
#sidebar.pull-hinting .sb-pull-hint{ opacity: 1; }

.sb-new{
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: 16px; margin-bottom: 10px;
  font-size: 13.5px; font-weight: 500; color: var(--green-soft);
  text-align: left; border: none; background: transparent;
}
.sb-new svg{ width: 16px; height: 16px; fill: var(--green-soft); flex-shrink: 0; }
.sb-new:active, .hcard:active{ transform: scale(.97); }

.sb-sec{
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--fg3); letter-spacing: .5px; padding: 2px 3px 8px; margin-top: 4px;
}

.hcard{
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 12px; border-radius: 16px;
  background: transparent; border: .5px solid transparent;
  margin-bottom: 6px;
  transition: transform .22s cubic-bezier(.2,1,.3,1), background .14s, border-color .14s;
}
@media (hover:hover) and (pointer:fine){
  .hcard:hover{
    background: var(--hover);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border-color: var(--liquid-border-strong);
  }
}
.hcard.active{
  background: linear-gradient(135deg, rgba(11,0,246,.075), rgba(80,90,255,.07));
  border-color: rgba(80,90,255,.25);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .35px rgba(80,90,255,.06), 0 8px 28px rgba(80,90,255,.05);
}
.hcard-body{ flex: 1; min-width: 0; }
.hcard-pre{
  font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; letter-spacing: -.15px;
}
.hcard-pre mark{
  background: rgba(80,90,255,.18); color: var(--green-soft);
  border-radius: 3px; padding: 0 1px;
}
.hcard.active .hcard-pre{ color: var(--green-soft); }
.hcard-meta{ font-size: 11px; color: var(--fg3); margin-top: 2px; }
.hcard-del{
  width: 24px; height: 24px; border-radius: 8px; background: transparent; border: none;
  color: var(--fg3); opacity: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.hcard-del svg{ width: 14px; height: 14px; fill: currentColor; }
.hcard:hover .hcard-del, .hcard:focus-within .hcard-del{ opacity: 1; pointer-events: auto; }
@media (pointer: coarse){
  .hcard-del{ opacity: 1; pointer-events: auto; }
}
.hcard-del:active{ background: rgba(255,59,48,.15); color: rgba(255,59,48,.85); transform: scale(.85); }

.hcard-pin{ display: none; width: 11px; height: 11px; margin-right: 3px; vertical-align: middle; }
.hcard.pinned .hcard-pin{ display: inline-block; }
.hcard-pin svg{ fill: var(--green-soft); }

.hcard-pre[contenteditable="true"]{
  outline: none; background: rgba(0,255,157,.1); border-radius: 7px;
  padding: 2px 5px; margin: -2px -5px; white-space: normal;
}

.h-empty{
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; padding: 48px 16px; text-align: center;
}
.h-empty svg{ width: 28px; height: 28px; fill: var(--fg3); opacity: .45; }
.h-empty p{ font-size: 13px; color: var(--fg3); line-height: 1.5; }

#content{
  flex: 1; overflow: hidden; position: relative; z-index: 1;
  touch-action: pan-y; display: flex; flex-direction: column; min-height: 0;
}
#scroll-area{
  flex: 1; position: relative; top: 0; right: 0; bottom: 0; left: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain; touch-action: pan-y;
  padding: calc(12px + var(--sat)) 0 16px;
  scroll-padding-top: 20px; scroll-padding-bottom: 24px;
  min-height: 0;
}
#msg-list{
  display: flex; flex-direction: column;
  padding: 0 calc(14px + var(--sar)) 0 calc(14px + var(--sal));
  min-height: 100%;
}
.msg-group{ display: flex; flex-direction: column; margin-bottom: 8px; }
.msg-group.u{ align-items: flex-end; }
.msg-group.a{ align-items: flex-start; }
.bubble, .ai-bubble{
  max-width: 100%; font-size: 15px; line-height: 1.5; letter-spacing: -.18px;
  word-break: break-word; overflow-wrap: anywhere; position: relative;
}
.u .bubble{
  color: #f7fffb; max-width: 85%; padding: 9px 14px; border-radius: 20px;
  background: linear-gradient(138deg, rgba(0,9,205,.78) 0%, rgba(80,90,255,.72) 48%, rgba(95,106,247,.66) 100%);
  border: .45px solid rgba(160,170,255,.32);
  box-shadow: 0 5px 26px rgba(80,90,255,.15), 0 3px 18px rgba(11,0,246,.08), 0 1.2px 0 rgba(255,255,255,.22) inset, 0 -.7px 0 rgba(0,0,0,.16) inset;
  -webkit-backdrop-filter: blur(24px) saturate(175%);
  backdrop-filter: blur(24px) saturate(175%);
}
.user-message-text{
  max-height: 7.5em;
  overflow: hidden;
}
.user-message-collapsible.is-expanded .user-message-text{
  max-height: none;
}
.user-message-expand{
  display: none;
  margin: 7px 0 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.78);
  font: inherit;
  font-size: 12px;
  line-height: 1.4;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.user-message-collapsible.can-collapse .user-message-expand{
  display: block;
}
.ai-bubble{ padding: 4px 0; background: transparent; border: none; box-shadow: none; }
.thinking{
  width: min(100%, 680px); margin: 4px 0 9px; border: 1px solid var(--sep);
  border-radius: 12px; background: rgba(255,255,255,.035); overflow: hidden;
}
.thinking summary{
  cursor: pointer; padding: 9px 12px; color: var(--fg2); font-size: 12px;
  user-select: none; list-style: none;
}
.thinking summary::-webkit-details-marker{ display: none; }
.thinking summary:before{ content: "›"; display: inline-block; margin-right: 7px; transition: transform .2s; }
.thinking[open] summary:before{ transform: rotate(90deg); }
.thinking-text{
  padding: 0 12px 11px; color: var(--fg3); font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
}

.md p{ margin: 0 0 8px; }
.md p:last-child{ margin-bottom: 0; }
.md h1, .md h2, .md h3{ margin: 12px 0 7px; line-height: 1.3; font-weight: 600; }
.md h1{ font-size: 19px; }
.md h2{ font-size: 17px; }
.md h3{ font-size: 15.5px; }
.md ul, .md ol{ margin: 6px 0 8px; padding-left: 22px; }
.md li{ margin: 3px 0; }
.md a{ color: var(--green-soft); text-decoration: none; }
.md hr{ border: none; border-top: 1px solid var(--sep); margin: 12px 0; }
.md .ic{
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: .88em; background: rgba(255,255,255,.045);
  padding: 1.5px 5px; border-radius: 6px; border: .5px solid var(--liquid-border);
}
.md table{
  width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px;
  border-radius: 10px; overflow: hidden; border: 1px solid var(--sep);
}
.md th{
  padding: 7px 11px; text-align: left; font-size: 11px; font-weight: 600;
  text-transform: uppercase; color: var(--fg2); letter-spacing: .3px;
  border-bottom: 1px solid var(--sep); white-space: nowrap;
}
.md td{ padding: 7px 11px; border-bottom: 1px solid var(--sep); vertical-align: top; }
.md tr:last-child td{ border-bottom: none; }

.err-bbl{
  display: inline-block; max-width: 90%; margin: 4px 0; padding: 9px 13px;
  font-size: 13.5px; line-height: 1.45; background: rgba(0,255,157,.095);
  border: .5px solid rgba(0,255,157,.2); border-radius: 15px; word-break: break-word;
}
.rcn-bar{
  display: flex; align-items: center; gap: 7px; margin: 5px 14px; padding: 8px 12px;
  background: rgba(0,40,218,.08); border: .5px solid rgba(0,40,218,.16);
  border-radius: 13px; font-size: 12px; color: rgba(80,90,255,.9);
}
.rcn-bar svg{ width: 13px; height: 13px; fill: currentColor; animation: spin 1.1s linear infinite; }

.typing{ display: flex; align-items: center; gap: 4px; padding: 10px 2px; }
.td{ width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); animation: tbounce 1.3s infinite ease-in-out; }
.td:nth-child(2){ animation-delay: .18s; }
.td:nth-child(3){ animation-delay: .36s; }
@keyframes tbounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: .4; }
  30%{ transform: translateY(-5px); opacity: 1; }
}
@-webkit-keyframes tbounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: .4; }
  30%{ transform: translateY(-5px); opacity: 1; }
}
.t-row{ display: flex; align-items: center; gap: 4px; margin-top: 3px; pointer-events: auto; opacity: .85; }
.tact{
  display: flex; align-items: center; gap: 4px; background: transparent;
  border: .5px solid transparent; color: var(--fg3); font-size: 11.5px;
  padding: 3px 7px; border-radius: 8px;
}
.tact:active{ transform: scale(.9); }
.tact svg{ width: 13px; height: 13px; fill: currentColor; }
.btime{ font-size: 11px; color: var(--fg3); padding: 0 4px; }

#ib-wrap{
  position: relative; z-index: 200;
  padding-bottom: var(--sab); padding-left: var(--sal); padding-right: var(--sar);
  background: transparent; overflow: visible; pointer-events: none;
  flex-shrink: 0; width: 100%;
}
[data-native-app="true"] #ib-wrap{ position: relative; flex-shrink: 0; }
#ib-wrap.keyboard-open{
  position: relative;
  margin-bottom: var(--native-keyboard-height, 0px);
}

.ib-inner{ padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; pointer-events: auto; background: transparent; }

.img-strip{ display: flex; gap: 7px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 1px 1px; }
.img-thumb{ position: relative; flex-shrink: 0; }
.img-thumb img{ width: 50px; height: 50px; object-fit: cover; border-radius: 13px; }
.img-rm{
  position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(5,12,8,.58); border: .45px solid var(--liquid-border-strong);
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  color: var(--fg2);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
}
.ib-row{ display: flex; align-items: flex-end; gap: 8px; }
.ibtn, .sbtn{

   function loadBranches(entry){
     if(entry && Array.isArray(entry.branches) && entry.branches.length){
       branches = entry.branches.map(function(branch){
         return {
           id: branch.id || branchId(),
           label: branch.label || "Ág",
           parentBranchId: branch.parentBranchId || null,
           forkIndex: typeof branch.forkIndex === "number" ? branch.forkIndex : null,
           messages: Array.isArray(branch.messages) ? branch.messages.slice() : []
         };
       });
       var preferred = entry.activeBranchId || null;
       var foundPreferred = false;
       if(preferred){
         for(var bi = 0; bi < branches.length; bi++){
           if(branches[bi].id === preferred){ foundPreferred = true; break; }
         }
       }
       activeBranchId = foundPreferred ? preferred : branches[0].id;
       messages = activeBranch().messages.slice();
       return;
     }
     var root = {id:branchId(), label:"Főág", parentBranchId:null, forkIndex:null, messages:Array.isArray(entry && entry.messages) ? entry.messages.slice() : []};
     branches = [root];
     activeBranchId = root.id;

   }

   function branchChoices(branch, index){
     var root = branch;
     var guard = 0;
     while(root.parentBranchId && guard < 64){
       var found = null;
       for(var i = 0; i < branches.length; i++){
         if(branches[i].id === root.parentBranchId){ found = branches[i]; break; }
       }
       if(!found) break;
       if(found.forkIndex != null && found.forkIndex !== index && root.forkIndex !== index) break;
       root = found;
       guard++;
     }
     while(root.parentBranchId && root.forkIndex === index && guard < 64){
       var found2 = null;
       for(var i2 = 0; i2 < branches.length; i2++){
         if(branches[i2].id === root.parentBranchId){ found2 = branches[i2]; break; }
       }
       if(!found2) break;
       root = found2;
       guard++;
     }
     var choices = [root];
     var queue = [root.id];
     var seen = {};
     seen[root.id] = true;
     while(queue.length){
       var pid = queue.shift();
       for(var j = 0; j < branches.length; j++){
         var candidate = branches[j];
         if(candidate.parentBranchId === pid && candidate.forkIndex === index && !seen[candidate.id]){
           seen[candidate.id] = true;
           choices.push(candidate);
           queue.push(candidate.id);
         }
       }
     }
     return choices.length > 1 ? choices : [];
   }

   function classifyToken(token, lang){
     if(/^(?:\/\/|\/\*|\*\/|#)/.test(token) || /^\/\*[\s\S]*?\*\/$/.test(token) || /^\/\/[^\n]*$/.test(token) || /^#[^\n]*$/.test(token)) return "tok-comment";
     if(/^["'`]/.test(token)) return "tok-string";
     if(/^<\/?[A-Za-z]/.test(token)) return "tok-tag";
     if(/^\d+(?:\.\d+)?$/.test(token)) return "tok-number";
     if(/^(true|false|null|undefined|NaN|Infinity)$/i.test(token)) return "tok-bool";
     if(/^(?:var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|this|class|extends|import|export|from|default|try|catch|finally|throw|async|await|yield|typeof|instanceof|in|of|void|delete|with|debugger|true|false|null)$/.test(token)) return "tok-keyword";
     if(/^[A-Za-z_$][\w$]*$/.test(token)) return "tok-property";
     return "";
   }

   function highlightCode(source, lang){
     if(typeof source !== "string") source = "";
     var re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|<\/?[A-Za-z][^>\s]*[^>]*>|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$]*\b)/g;
     var result = "", last = 0, match;
     while((match = re.exec(source)) !== null){
       result += escapeHtml(source.slice(last, match.index));
       var token = match[0];
       var cls = classifyToken(token, lang);
       result += cls ? '<span class="' + cls + '">' + escapeHtml(token) + '</span>' : escapeHtml(token);
       last = match.index + token.length;
     }
     return result + escapeHtml(source.slice(last));
   }

   function tableRow(line){

     if(trimmed[0] === "|") trimmed = trimmed.slice(1);
     if(trimmed[trimmed.length - 1] === "|") trimmed = trimmed.slice(0, -1);
     var cells = [];
     var cur = "";
     var inCode = false;
     for(var i = 0; i < trimmed.length; i++){
       var ch = trimmed[i];
       if(ch === "`"){ inCode = !inCode; cur += ch; continue; }
       if(ch === "\\" && i + 1 < trimmed.length && trimmed[i+1] === "|"){ cur += "|"; i++; continue; }
       if(ch === "|" && !inCode){ cells.push(cur.trim()); cur = ""; continue; }
       cur += ch;

   }

  function markdown(value){
    if(typeof value !== "string") value = "";
     var placeholders = [];
     var markerPrefix = "\uE000PH";
     var markerSuffix = "\uE001";
     function protect(html){
       var id = placeholders.length;
       placeholders.push(html);
       return markerPrefix + id + markerSuffix;
     }
     var text = value.replace(/\r/g, "");
     text = text.replace(/```([\s\S]*?)```/g, function(match, code){
      var lang = "";
      var body = code;
      var firstNL = code.indexOf("\n");
      if(firstNL >= 0 && firstNL < 40){
        var maybe = code.slice(0, firstNL).trim();
        if(/^[a-zA-Z0-9_+-]+$/.test(maybe)){
          lang = maybe;
          body = code.slice(firstNL + 1);
        } else if(firstNL === 0){
          body = code.slice(1);
        }
      }
       return protect(codeBlockHtml(lang, body));
    });
     var sourceLines = text.split("\n");
     var tableLines = [];
     for(var lineIndex = 0; lineIndex < sourceLines.length; lineIndex++){
       var headerLine = sourceLines[lineIndex];
       var dividerLine = sourceLines[lineIndex + 1] || "";
       if(headerLine.indexOf("|") !== -1 && /^\s*\|?(\s*:?-{3,}:?\s*\|?)+\s*$/.test(dividerLine)){
         var header = tableRow(headerLine);
         var sep = tableRow(dividerLine);
         if(header.length === sep.length && header.length > 0){
           var rows = [];
           lineIndex += 2;
           while(lineIndex < sourceLines.length && sourceLines[lineIndex].indexOf("|") !== -1 && sourceLines[lineIndex].trim()){
             rows.push(tableRow(sourceLines[lineIndex]));
             lineIndex++;
           }
           tableLines.push(protect(tableBlockHtml(header, rows)));
           lineIndex--;
           continue;
         }
       }
       tableLines.push(headerLine);
     }
     text = tableLines.join("\n");
    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, function(_, code){ return protect('<span class="ic">' + code + '</span>'); });
    text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    var lines = text.split("\n");
    var outLines = [];
    var listType = null;
    var listItems = [];
    var listStart = 1;
    function flushList(){
      if(!listType) return;
      var tag = listType === "ol" ? "ol" : "ul";
      var startAttr = listType === "ol" && listStart !== 1 ? ' start="' + listStart + '"' : "";
      outLines.push("<" + tag + startAttr + ">" + listItems.map(function(item){ return "<li>" + item + "</li>"; }).join("") + "</" + tag + ">");
      listType = null;
      listItems = [];
      listStart = 1;
    }
    for(var li = 0; li < lines.length; li++){
      var line = lines[li];
      var ulMatch = line.match(/^\s*[-*]\s+(.+)$/);
      var olMatch = line.match(/^\s*(\d+)\.\s+(.+)$/);
      if(ulMatch){
        if(listType && listType !== "ul") flushList();
        listType = "ul";
        listItems.push(ulMatch[1]);
      } else if(olMatch){
        if(listType && listType !== "ol") flushList();
        if(!listType) listStart = parseInt(olMatch[1], 10) || 1;
        listType = "ol";
        listItems.push(olMatch[2]);
      } else {
        flushList();
        outLines.push(line);
      }
    }
    flushList();
    text = outLines.join("<br>");
     text = text.replace(new RegExp(markerPrefix + "(\\d+)" + markerSuffix, "g"), function(_, i){ return placeholders[parseInt(i, 10)] || ""; });
    return text;
  }

  function splitAssistantMessage(message){
    var content = typeof message.content === "string" ? message.content : "";
    var thinking = typeof message.reasoning_content === "string" ? message.reasoning_content : "";
    var thinkBlocks = [];
    var re = /<think>([\s\S]*?)<\/think>/g;
    var m;
    while((m = re.exec(content)) !== null){
      thinkBlocks.push(m[1].trim());
    }
    content = content.replace(/<think>[\s\S]*?<\/think>/g, "");
    if(thinkBlocks.length){
      thinking = thinking ? thinking + "\n" + thinkBlocks.join("\n") : thinkBlocks.join("\n");
    }
    var openIdx = content.indexOf("<think>");
    if(openIdx !== -1){
      var afterOpen = content.slice(openIdx + 7);
      var closeIdx = afterOpen.indexOf("</think>");
      if(closeIdx === -1){
        var partial = afterOpen.trim();
        if(partial){
          thinking = thinking ? thinking + "\n" + partial : partial;
        }
        content = content.slice(0, openIdx);
      } else {
        var block = afterOpen.slice(0, closeIdx).trim();
        if(block){
          thinking = thinking ? thinking + "\n" + block : block;
        }
        content = content.slice(0, openIdx) + afterOpen.slice(closeIdx + 8);
      }
    } else {
      var endOnly = content.indexOf("</think>");
      if(endOnly !== -1){
        var leading = content.slice(0, endOnly).trim();
        if(leading){
          thinking = thinking ? thinking + "\n" + leading : leading;
        }
        content = content.slice(endOnly + 8);
      }
    }
    return { content: content.trim(), thinking: thinking.trim() };
  }

      });
      return { text: text, images: images };
    }
    return { text: String(content), images: [] };
  }

       event.preventDefault();
       lightboxZoom = Math.max(.5, Math.min(5, lightboxZoom + (event.deltaY < 0 ? .2 : -.2)));
       paintLightbox();
     }, {passive:false});
     lightboxStage.addEventListener("pointerdown", function(event){
       lightboxDrag = {x:event.clientX, y:event.clientY, px:lightboxPanX, py:lightboxPanY};
       lightboxMoved = false;
       lightboxStage.classList.add("dragging");
       try{ lightboxStage.setPointerCapture(event.pointerId); }catch(e){}
     });
     lightboxStage.addEventListener("pointermove", function(event){
       if(!lightboxDrag) return;
       var dx = event.clientX - lightboxDrag.x;
       var dy = event.clientY - lightboxDrag.y;
       if(Math.abs(dx) + Math.abs(dy) > 4) lightboxMoved = true;
       lightboxPanX = lightboxDrag.px + dx;
       lightboxPanY = lightboxDrag.py + dy;
       paintLightbox();
     });
     function endDrag(){
       lightboxDrag = null;

     }
     lightboxStage.addEventListener("pointerup", endDrag);
     lightboxStage.addEventListener("pointercancel", endDrag);
     lightboxStage.addEventListener("lostpointercapture", endDrag);
     lightboxStage.addEventListener("click", function(event){
       if(event.target === lightboxStage && lightboxZoom <= 1.05 && !lightboxMoved) closeLightbox();

     var pinchStart = 0;
     lightboxStage.addEventListener("touchstart", function(e){
       if(e.touches.length === 2){
         var dx = e.touches[0].clientX - e.touches[1].clientX;
         var dy = e.touches[0].clientY - e.touches[1].clientY;
         pinchStart = Math.sqrt(dx*dx + dy*dy);
       }
     }, {passive:true});
     lightboxStage.addEventListener("touchmove", function(e){
       if(e.touches.length === 2 && pinchStart > 0){

         var dy = e.touches[0].clientY - e.touches[1].clientY;
         var dist = Math.sqrt(dx*dx + dy*dy);
         var scale = dist / pinchStart;
         lightboxZoom = Math.max(.5, Math.min(5, lightboxZoom * scale));
         pinchStart = dist;
         paintLightbox();
       }
     }, {passive:false});
   }

        return entry && typeof entry === "object" && typeof entry.id === "string";
      }).map(function(entry){
        if(!Array.isArray(entry.messages)) entry.messages = [];
        if(entry.branches && !Array.isArray(entry.branches)) entry.branches = null;
        if(typeof entry.title !== "string") entry.title = "Beszélgetés";
        return entry;
      });
    }catch(e){ history = []; }
  }

  function sanitizeForStorage(value){
    if(value == null) return value;
    if(typeof value === "string"){
      if(value.indexOf("data:image") === 0 && value.length > 256){
        return "";
      }
      return value;
    }
    if(Array.isArray(value)){
      return value.map(sanitizeForStorage);
    }
    if(typeof value === "object"){
      var out = {};
      for(var k in value){
        if(Object.prototype.hasOwnProperty.call(value, k)){
          if(k === "url" && typeof value[k] === "string" && value[k].indexOf("data:image") === 0 && value[k].length > 256){
            out[k] = "";
            out._imageStripped = true;
          } else {
            out[k] = sanitizeForStorage(value[k]);
          }
        }
      }
      return out;
    }
    return value;
  }
  function saveHistory(){
    try{
      var safe = sanitizeForStorage(history);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
    }catch(e){
      try{
        var reduced = history.slice(0, Math.max(1, Math.floor(history.length / 2))).map(function(entry){
          var copy = sanitizeForStorage(entry);
          if(copy && Array.isArray(copy.messages)){
            copy.messages = copy.messages.map(function(m){
              if(!m) return m;
              var o = {};
              for(var k in m){ if(Object.prototype.hasOwnProperty.call(m, k) && k !== "timeline") o[k] = m[k]; }
              if(typeof o.content === "string" && o.content.length > 4000) o.content = o.content.slice(0, 4000);
              return o;
            });
          }
          if(copy && Array.isArray(copy.branches)){
            copy.branches = copy.branches.map(function(b){
              var bb = {id:b.id, label:b.label, parentBranchId:b.parentBranchId, forkIndex:b.forkIndex, messages:[]};
              if(Array.isArray(b.messages)) bb.messages = b.messages.slice(-20);
              return bb;
            });
          }
          return copy;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reduced));
        history = reduced;
        if(typeof toast === "function") toast("Előzmények csökkentve (tárhely)", "inf");
      }catch(e2){
        if(typeof toast === "function") toast("Nem sikerült menteni az előzményeket", "err");

  }
